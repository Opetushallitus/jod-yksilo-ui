name: Sync Translations to Tolgee

on:
  pull_request:
    types:
      - closed
    branches:
      - main

# Serialize runs so concurrently merged PRs cannot race on the same Tolgee state.
concurrency:
  group: tolgee-sync
  cancel-in-progress: false

jobs:
  sync-translations:
    name: Push translations and tag keys
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # manage-tags reads history to find the commit that removed each key

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/krypton
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts && npm exec allow-scripts run

      - name: Push translations to Tolgee
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
        run: npm run translations:push

      - name: Manage Tolgee tags
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: npm run translations:tag
